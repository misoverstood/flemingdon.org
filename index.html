<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.open-meteo.com; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>flemingdon.org</title>
<meta name="description" content="A line a day. Lyrics, dialogue, quotes and passages, with the context behind them.">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#fffdf7">

<meta property="og:type" content="website">
<meta property="og:site_name" content="flemingdon.org">
<meta property="og:title" content="flemingdon.org">
<meta property="og:description" content="A line a day. Lyrics, dialogue, quotes and passages, with the context behind them.">
<meta property="og:url" content="https://flemingdon.org/">
<meta property="og:image" content="https://flemingdon.org/android-chrome-512x512.png">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..600,0..100,0..1&family=Lato:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: light dark;

    --ink:        #17140f;
    --ink-soft:   #4a453c;
    --ink-faint:  #8b8478;
    --rule:       #e2dccd;
    --paper:      #fffdf7;
    --accent:     #46654e;

    --serif: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
    --sans:  "Lato", "Helvetica Neue", Helvetica, Arial, sans-serif;

    box-sizing: border-box;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink:       #f0ebe0;
      --ink-soft:  #b8b1a3;
      --ink-faint: #7f786c;
      --rule:      #33302a;
      --paper:     #14120e;
      --accent:    #9dbfa3;
    }
  }

  *, *::before, *::after { box-sizing: inherit; }

  html { height: 100%; }

  body {
    min-height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: calc(2rem + env(safe-area-inset-top, 0px)) 1.5rem
             calc(2rem + env(safe-area-inset-bottom, 0px));
  }

  .wrap {
    width: 100%;
    max-width: 46rem;
    margin: 0 auto;
  }

  /* ---------------------------------------------------------- entry */

  .entry { margin-bottom: 3rem; }

  .headword {
    margin: 0;
    font-size: clamp(1.7rem, 4.4vw, 3.05rem);
    font-weight: 400;
    line-height: 1.24;
    letter-spacing: -0.012em;
    font-variation-settings: "opsz" 144, "SOFT" 45, "WONK" 1;
    white-space: pre-wrap;
    text-wrap: pretty;
  }

  .grammar {
    margin: 1.2rem 0 0;
    font-family: var(--sans);
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .grammar .kind {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    text-transform: lowercase;
    letter-spacing: 0;
    font-size: 1rem;
    font-variation-settings: "opsz" 24, "SOFT" 60, "WONK" 1;
    color: var(--ink-soft);
    margin-right: 0.55rem;
  }

  .senses {
    margin: 2.1rem 0 0;
    padding: 0 0 0 1.5rem;
    border-left: 2px solid var(--rule);
    max-width: 36rem;
  }

  .senses p {
    margin: 0 0 1.05rem;
    font-size: 1.05rem;
    line-height: 1.62;
    color: var(--ink-soft);
    font-variation-settings: "opsz" 14, "SOFT" 30, "WONK" 0;
    text-wrap: pretty;
  }

  .senses p:last-child { margin-bottom: 0; }

  /* your own gloss, set a shade darker than sourced text */
  .senses p.own { color: var(--ink); }

  .facts {
    margin: 1.9rem 0 0;
    padding: 0;
    list-style: none;
    font-family: var(--sans);
    font-size: 0.82rem;
    line-height: 1.85;
    color: var(--ink-faint);
  }

  .facts .label {
    display: inline-block;
    min-width: 5.5rem;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
  }

  .facts .value { color: var(--ink-soft); }

  .bare {
    margin: 2.1rem 0 0;
    font-family: var(--sans);
    font-size: 0.84rem;
    color: var(--ink-faint);
    font-style: italic;
  }

  /* ---------------------------------------------------------- footer */

  footer {
    margin-top: 3.25rem;
    padding-top: 1.35rem;
    border-top: 1px solid var(--rule);
    font-family: var(--sans);
    font-size: 0.76rem;
    line-height: 1.9;
    color: var(--ink-faint);
    max-width: 36rem;
  }

  footer p { margin: 0 0 0.45rem; }
  footer p:last-child { margin-bottom: 0; }

  footer a {
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  .credits { opacity: 0.8; }

  .ring { margin-top: 0.9rem; line-height: 2.1; }
  .ring a { white-space: nowrap; }
  .ring a[aria-current] { color: var(--ink); }

  .sep { margin: 0 0.45rem; opacity: 0.5; }

  @media (max-width: 24rem) {
    body { padding-left: 1.15rem; padding-right: 1.15rem; }
    .facts .label { display: block; min-width: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <main class="entry" id="entry">
    <p class="bare" id="loading">Loading…</p>
  </main>

  <footer>
    <p id="dateline"></p>
    <p class="credits"><span id="sourceline"></span>Weather from <a href="https://open-meteo.com">Open-Meteo</a>.<span id="tmdb-notice"></span></p>
    <p class="ring"><a href="https://muhummud.org/">muhummud.org</a>
      <span class="sep">·</span>
      <a href="https://thatstheworst.com/">thatstheworst.com</a>
      <span class="sep">·</span>
      <a href="https://flemingdon.org/" aria-current="page">flemingdon.org</a>
      <span class="sep">·</span>
      <a href="https://naseema.net/">naseema.net</a>
      <span class="sep">·</span>
      <a href="https://iseentit.com/">iseentit.com</a></p>
  </footer>

</div>

<script src="/app.js"></script>
</body>
</html>
