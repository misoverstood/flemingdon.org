name: Daily entry

on:
  schedule:
    # 09:05 UTC, which is 05:05 Toronto in summer and 04:05 in winter
    - cron: "5 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-entry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build item.json
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GENIUS_TOKEN: ${{ secrets.GENIUS_TOKEN }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python scripts/build.py

      - name: Commit if changed
        run: |
          git config user.name "flemingdon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add item.json data/used.json data/entries-cache.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily entry: $(date -u +%Y-%m-%d)"
            git push
          fi