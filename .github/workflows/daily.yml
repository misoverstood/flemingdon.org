name: Daily entry

on:
  schedule:
    # 09:37 UTC = 05:37 Toronto in summer, 04:37 in winter.
    # Deliberately an odd minute: GitHub drops or delays scheduled runs
    # clustered at the top of the hour.
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-entry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to full commit SHAs, not tags. A tag can be moved
      # to point at different code; a SHA cannot. Dependabot keeps these current.
      - name: Check out gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build item.json
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          GENIUS_TOKEN: ${{ secrets.GENIUS_TOKEN }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python scripts/build.py

      - name: Commit if changed
        run: |
          git config user.name "flemingdon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add item.json data/used.json data/entries-cache.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily entry: $(date -u +%Y-%m-%d)"
            git push
          fi